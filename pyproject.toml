[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-tts-hub"
version = "0.1.0"
description = "Multi-provider TTS service (Pocket TTS, VieNeu)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "soundfile",
    "numpy",
    "torch",
    "torchcodec",
    "vieneu",
    "pyloudnorm>=0.2.0",
    "neucodec>=0.0.6",
    "spaces"
]

[tool.setuptools]
packages = ["api", "providers"]
py-modules = ["main", "registry"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.uv]
override-dependencies = ["librosa>=0.10", "numba>=0.60"]
